services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orders}"]
      interval: 5s
      timeout: 3s
      retries: 5

  mlflow:
    build:
      context: ./mlflow_service
    entrypoint:
      - /bin/sh
      - -c
      - |
        URI=$$(python3 -c "import urllib.parse, pathlib; pw=urllib.parse.quote_plus(pathlib.Path('/run/secrets/db_password').read_text().strip()); print(f'postgresql+psycopg2://orders:{pw}@postgres:5432/mlflow')")
        exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri "$$URI" --serve-artifacts --artifacts-destination /mlartifacts
    secrets:
      - db_password
    volumes:
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy

  forecast-api:
    build:
      context: .
      dockerfile: forecast-service/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-house-price}
      MODEL_ALIAS: ${MODEL_ALIAS:-prod}
    depends_on:
      - mlflow

  orders-api:
    build:
      context: .
      dockerfile: orders-service/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orders}
      POSTGRES_DB: ${POSTGRES_DB:-orders}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      FORECAST_URL: http://forecast-api:8001/predict
      FORECAST_TIMEOUT: ${FORECAST_TIMEOUT:-3.0}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      BATCH_MAX_ITEMS: ${BATCH_MAX_ITEMS:-50}
    secrets:
      - db_password
      - jwt_secret_key
    ports:
      - "${ORDERS_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.3.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - orders-api
      - forecast-api

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
    secrets:
      - grafana_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  mlartifacts:

secrets:
  db_password:
    file: ./secrets/db_password
  jwt_secret_key:
    file: ./secrets/jwt_secret_key
  grafana_password:
    file: ./secrets/grafana_password.txt
